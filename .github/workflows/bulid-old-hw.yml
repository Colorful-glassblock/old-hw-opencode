name: Build Core2 Bun (with official Bun bootstrap)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install official Bun (normal version)
        run: |
          # 安装官方发布的最新 Bun
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/bun-src/target
          key: ${{ runner.os }}-bun-core2-${{ hashFiles('/tmp/bun-src/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bun-core2-

      - name: Clone Bun and lol-html
        run: |
          git clone --depth 1 https://github.com/oven-sh/bun.git /tmp/bun-src
          cd /tmp/bun-src
          mkdir -p vendor
          git clone --depth 1 https://github.com/cloudflare/lol-html.git vendor/lolhtml
          if [ ! -f "vendor/lolhtml/Cargo.toml" ]; then
            echo "lol-html download failed!"
            exit 1
          fi

      - name: Generate build_options.rs with official Bun
        run: |
          cd /tmp/bun-src
          
          # 用官方 Bun 执行配置生成命令
          bun bd --configure-only
          
          # 验证文件是否生成
          if [ -f "build/debug/codegen/build_options.rs" ]; then
            echo "build_options.rs generated successfully!"
            cat build/debug/codegen/build_options.rs | head -10
          else
            echo "Failed to generate build_options.rs!"
            find . -name "build_options.rs" 2>/dev/null
            exit 1
          fi

      - name: Build Bun (Core2 optimized)
        run: |
          cd /tmp/bun-src
          
          # 设置 Core2 优化
          export RUSTFLAGS="-C target-cpu=core2 -C opt-level=3 -C link-arg=-s"
          
          # 构建
          cargo build --release --target x86_64-unknown-linux-gnu
          
          # 验证产物
          if [ -f "target/x86_64-unknown-linux-gnu/release/bun" ]; then
            echo "Build successful!"
            ls -la target/x86_64-unknown-linux-gnu/release/bun
          else
            echo "Build failed: bun binary not found"
            exit 1
          fi

      - name: Upload Core2 Bun
        uses: actions/upload-artifact@v4
        with:
          name: bun-core2
          path: /tmp/bun-src/target/x86_64-unknown-linux-gnu/release/bun
