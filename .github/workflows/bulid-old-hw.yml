name: Build Core2 Bun + opencode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: false

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/bun-src/target
          key: ${{ runner.os }}-bun-core2-${{ hashFiles('/tmp/bun-src/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-bun-core2-

      - name: Clone Bun and manually fix submodules
        run: |
          # 1. 浅克隆 Bun
          git clone --depth 1 https://github.com/oven-sh/bun.git /tmp/bun-src
          cd /tmp/bun-src
          
          # 2. 手动拉取 lolhtml 子模块（直接克隆到 vendor/lolhtml）
          mkdir -p vendor
          git clone --depth 1 https://github.com/oven-sh/lolhtml.git vendor/lolhtml
          
          # 3. 如果还有其他缺失的子模块，可以补充（可选）
          # git submodule update --init --depth 1 --recursive || true
          
          # 4. 设置 Core2 优化
          export RUSTFLAGS="-C target-cpu=core2 -C opt-level=3 -C link-arg=-s"
          
          # 5. 构建 Bun（主包是 bun）
          cargo build --release --target x86_64-unknown-linux-gnu -p bun
          
          # 6. 复制产物
          cp target/x86_64-unknown-linux-gnu/release/bun ${{ github.workspace }}/bun-core2

      - name: Make Bun executable
        run: chmod +x ${{ github.workspace }}/bun-core2

      - name: Install opencode dependencies with Core2 Bun
        run: |
          ${{ github.workspace }}/bun-core2 install

      - name: Build opencode with Core2 Bun
        run: |
          # 自动查找入口文件
          ENTRY=$(find packages -name "index.ts" -o -name "cli.ts" -o -name "main.ts" | head -1)
          if [ -z "$ENTRY" ]; then
            echo "No entry found! Listing all ts files:"
            find . -name "*.ts" | head -20
            exit 1
          fi
          echo "Entry found: $ENTRY"
          ${{ github.workspace }}/bun-core2 build $ENTRY \
            --compile --target=bun-linux-x64 --outfile=opencode-core2

      - name: Upload both binaries
        uses: actions/upload-artifact@v4
        with:
          name: core2-bun-and-opencode
          path: |
            bun-core2
            opencode-core2
