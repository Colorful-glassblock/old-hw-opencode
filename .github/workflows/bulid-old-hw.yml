name: Core2 Bun + opencode

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache: false

      - name: Install Clang 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt update
          sudo apt install -y clang-21 lld-21 libclang-rt-21-dev
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          sudo ln -sf /usr/bin/lld-21 /usr/bin/lld

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install official Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: Clone Bun (full, with submodules)
        run: |
          # 完整克隆（不限制深度）
          git clone https://github.com/oven-sh/bun.git /tmp/bun-src
          cd /tmp/bun-src
          # 官方方式：递归拉取子模块
          git submodule update --init --recursive
          if [ ! -f "vendor/lolhtml/Cargo.toml" ]; then
            echo "❌ Submodule failed!"
            exit 1
          fi
          echo "✅ Submodules ready"

      - name: Generate build_options.rs
        run: |
          cd /tmp/bun-src
          export PATH="$HOME/.bun/bin:$PATH"
          export CC=/usr/bin/clang-21
          export CXX=/usr/bin/clang++-21
          export LD=/usr/bin/lld-21
          bun bd --configure-only

      - name: Build Core2 Bun (official build script)
        run: |
          cd /tmp/bun-src
          export PATH="$HOME/.bun/bin:$PATH"
          export CC=/usr/bin/clang-21
          export CXX=/usr/bin/clang++-21
          export LD=/usr/bin/lld-21
          # 复制官方构建方式：bun install + bun run build
          bun install
          bun run build --target=x86_64-linux --cpu=core2
          # 查找产物
          find . -name "bun" -type f -executable | head -5

      - name: Upload Core2 Bun
        uses: actions/upload-artifact@v4
        with:
          name: bun-core2
          path: /tmp/bun-src/packages/bun-release/bun
